<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MeshMedic">
  <defs>
    <linearGradient id="mm-cross" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#19B3A6"/>
      <stop offset="1" stop-color="#0B6E6A"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="64" height="64" rx="16" fill="#0D2B30"/>
  <!-- the medical cross -->
  <path fill="url(#mm-cross)" d="M25 9h14a3 3 0 0 1 3 3v13h13a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3H42v13a3 3 0 0 1-3 3H25a3 3 0 0 1-3-3V39H9a3 3 0 0 1-3-3v-8a3 3 0 0 1 3-3h13V12a3 3 0 0 1 3-3z"/>
  <!-- the mesh: every arm connected to the centre and to its neighbours -->
  <g stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity="0.9" fill="none">
    <path d="M32 17 L32 47 M15 32 L49 32"/>
    <path d="M32 17 L49 32 L32 47 L15 32 Z" opacity="0.55"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="32" cy="17" r="3.4"/>
    <circle cx="49" cy="32" r="3.4"/>
    <circle cx="32" cy="47" r="3.4"/>
    <circle cx="15" cy="32" r="3.4"/>
  </g>
  <!-- the patient at the centre -->
  <circle cx="32" cy="32" r="5.6" fill="#FF6B57" stroke="#FFFFFF" stroke-width="2.2"/>
</svg>
