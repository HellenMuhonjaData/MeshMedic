<title>MeshMedic Command Center</title>
<style>
  /* ============================================================
     SINGLE COLOR CONFIG — this :root block (and its dark-mode
     mirrors below) is the ONLY place color values live. When
     MeshMedic brand colors are chosen, change them here only.
     ============================================================ */
  :root{
    --bg:#F6F7F8;
    --surface:#FFFFFF;
    --surface-alt:#EEF0F3;
    --line:#DCE0E6;
    --ink:#171A1F;
    --ink-soft:#4B515C;
    --ink-faint:#868D99;
    --accent:#2C4A9B;
    --accent-ink:#FFFFFF;
    --accent-soft:#E7EBF6;
    --good:#1E8E5A;      --good-soft:#E4F5EC;
    --warn:#A8720A;      --warn-soft:#FBF0DC;
    --critical:#B33A34;  --critical-soft:#FBE8E6;
    --unknown:#9AA1AC;   --unknown-soft:#ECEEF1;
    --sample:#6E4BA6;    --sample-soft:#F1ECFA;
    --shadow: 0 1px 2px rgba(23,26,31,.05), 0 8px 24px -12px rgba(23,26,31,.12);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#10131A; --surface:#171B23; --surface-alt:#1E232D; --line:#2B313D;
      --ink:#EDEFF3; --ink-soft:#B4BAC5; --ink-faint:#767E8C;
      --accent:#7C9AEF; --accent-ink:#0E1320; --accent-soft:#1E2A4A;
      --good:#43C787;   --good-soft:#123423;
      --warn:#E0A83B;   --warn-soft:#3A2C0F;
      --critical:#E2726C; --critical-soft:#3D1917;
      --unknown:#6B7280; --unknown-soft:#252A33;
      --sample:#B393E0; --sample-soft:#2E2440;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#10131A; --surface:#171B23; --surface-alt:#1E232D; --line:#2B313D;
    --ink:#EDEFF3; --ink-soft:#B4BAC5; --ink-faint:#767E8C;
    --accent:#7C9AEF; --accent-ink:#0E1320; --accent-soft:#1E2A4A;
    --good:#43C787;   --good-soft:#123423;
    --warn:#E0A83B;   --warn-soft:#3A2C0F;
    --critical:#E2726C; --critical-soft:#3D1917;
    --unknown:#6B7280; --unknown-soft:#252A33;
    --sample:#B393E0; --sample-soft:#2E2440;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: "Segoe UI","-apple-system","Helvetica Neue",Arial,sans-serif;
    font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    text-wrap:balance; margin:0;
  }
  .mono, .tabular{ font-family:"Cascadia Code",Consolas,"SF Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums; }
  a{color:inherit;}
  ::selection{ background:var(--accent-soft); }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }
  table{ border-collapse:collapse; width:100%; }
  th{ text-align:left; }

  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:14px 24px; background:var(--surface); border-bottom:1px solid var(--line);
  }
  .wordmark{ display:flex; align-items:baseline; gap:8px; }
  .wordmark .name{ font-size:19px; font-weight:600; letter-spacing:-.01em; }
  .wordmark .tag{ font-size:12px; color:var(--ink-faint); letter-spacing:.02em; }
  .release-pill{
    font-size:12px; padding:4px 10px; border-radius:999px;
    background:var(--surface-alt); color:var(--ink-soft); border:1px solid var(--line);
    white-space:nowrap;
  }
  .stale-pill{
    font-size:12px; padding:4px 10px; border-radius:999px;
    border:1px solid var(--warn); background:var(--warn-soft); color:var(--warn); white-space:nowrap;
  }
  .spacer{flex:1;}

  .mode-toggle{ display:flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .mode-toggle button{
    appearance:none; border:0; background:var(--surface); color:var(--ink-soft);
    font:inherit; font-size:12.5px; font-weight:600; letter-spacing:.02em;
    padding:7px 14px; cursor:pointer;
  }
  .mode-toggle button.active{ background:var(--accent); color:var(--accent-ink); }
  .mode-toggle button:not(.active):hover{ background:var(--surface-alt); }

  .shell{ display:flex; align-items:flex-start; }
  .sidenav{
    width:236px; flex:none; padding:20px 12px; position:sticky; top:53px;
    height:calc(100vh - 53px); overflow-y:auto;
    border-right:1px solid var(--line);
  }
  .sidenav .group-label{
    font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    padding:6px 12px; margin-top:4px;
  }
  .sidenav a{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    text-decoration:none; font-size:13.5px; color:var(--ink-soft);
    padding:8px 12px; border-radius:8px; margin:1px 0;
  }
  .sidenav a:hover{ background:var(--surface-alt); color:var(--ink); }
  .sidenav a.active{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .sidenav a .soon{ font-size:10px; color:var(--ink-faint); font-weight:500; }

  main{ flex:1; min-width:0; padding:28px 32px 80px; max-width:1120px; }

  .sample-banner{
    display:flex; align-items:center; gap:10px;
    background:var(--sample-soft); color:var(--sample); border:1px solid var(--sample);
    border-radius:10px; padding:10px 14px; font-size:13px; font-weight:600;
    margin-bottom:22px;
  }
  .sample-banner .dot{ width:7px; height:7px; border-radius:999px; background:var(--sample); flex:none; }

  .hero{ margin-bottom:24px; }
  .hero h1{ font-size:26px; margin-bottom:6px; }
  .hero h2.pagetitle{ font-size:24px; margin-bottom:6px; }
  .hero p{ color:var(--ink-soft); max-width:66ch; font-size:15px; margin:0; }

  .breadcrumb{ font-size:12.5px; color:var(--ink-faint); margin-bottom:14px; }
  .breadcrumb a{ color:var(--accent); text-decoration:none; }
  .breadcrumb a:hover{ text-decoration:underline; }

  .grid{ display:grid; grid-template-columns:repeat(12,1fr); gap:16px; }
  .card{
    grid-column:span 4; background:var(--surface); border:1px solid var(--line);
    border-radius:14px; padding:18px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; gap:10px; min-width:0;
  }
  a.card{ text-decoration:none; color:inherit; cursor:pointer; transition:border-color .12s, transform .12s; }
  a.card:hover{ border-color:var(--accent); }
  .card.span-6{ grid-column:span 6; }
  .card.span-8{ grid-column:span 8; }
  .card.span-12{ grid-column:span 12; }
  .card-label{ font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); font-weight:600; }
  .card h3{ font-size:15px; }
  .card .big{ font-size:30px; font-weight:600; letter-spacing:-.01em; }
  .card .sub{ font-size:12.5px; color:var(--ink-faint); }
  .card-foot{ font-size:12px; color:var(--accent); font-weight:600; margin-top:auto; }

  .badge{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .badge.sample{ background:var(--sample-soft); color:var(--sample); }
  .badge.good{ background:var(--good-soft); color:var(--good); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .badge.critical{ background:var(--critical-soft); color:var(--critical); }
  .badge.unknown{ background:var(--unknown-soft); color:var(--unknown); }

  .status-row{ display:flex; align-items:center; justify-content:space-between; padding:9px 0; border-top:1px solid var(--line); font-size:13.5px; gap:10px; }
  .status-row:first-of-type{ border-top:none; }
  .status-row .name{ display:flex; align-items:center; gap:9px; }
  .dot{ width:8px; height:8px; border-radius:999px; flex:none; }
  .dot.unknown{ background:var(--unknown); }
  .dot.good{ background:var(--good); }
  .dot.critical{ background:var(--critical); }
  .status-row .meta{ color:var(--ink-faint); font-size:12px; white-space:nowrap; }

  .bar-track{ height:8px; border-radius:999px; background:var(--surface-alt); overflow:hidden; }
  .bar-fill{ height:100%; background:var(--accent); border-radius:999px; }

  .progress-line{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; color:var(--ink-faint); gap:10px; }

  .req-chip-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .req-chip{ font-size:12px; padding:4px 10px; border-radius:8px; background:var(--surface-alt); color:var(--ink-soft); border:1px solid var(--line); }
  .req-chip b{ color:var(--ink); }

  .guardrail-row{ display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .guardrail-row:first-of-type{ border-top:none; }
  .guardrail-row .rid{ font-size:11px; color:var(--ink-faint); flex:none; width:52px; padding-top:2px; }
  .guardrail-row .txt{ font-size:13px; color:var(--ink-soft); flex:1; }

  .sparkline-wrap{ display:flex; flex-direction:column; gap:6px; }
  .empty-state{
    border:1px dashed var(--line); border-radius:10px; padding:16px;
    color:var(--ink-faint); font-size:13px; text-align:center;
  }

  .stub{ max-width:64ch; }
  .stub .not-built{
    display:inline-flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600;
    color:var(--ink-faint); background:var(--surface-alt); border:1px solid var(--line);
    border-radius:999px; padding:6px 12px;
  }

  .section{ margin-top:30px; }
  .section-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; gap:10px; }
  .section-head h3{ font-size:16px; }
  .section-head .count{ font-size:12px; color:var(--ink-faint); }

  .table-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--surface); box-shadow:var(--shadow); }
  table.data{ font-size:13px; }
  table.data th{ font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap; }
  table.data td{ padding:10px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  table.data tr:last-child td{ border-bottom:none; }
  table.data tr.clickable{ cursor:pointer; }
  table.data tr.clickable:hover{ background:var(--surface-alt); }

  .detail-panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:22px 24px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px; }
  .kv{ display:grid; grid-template-columns:140px 1fr; gap:6px 14px; font-size:13.5px; }
  .kv dt{ color:var(--ink-faint); }
  .kv dd{ margin:0; }

  .gantt{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px 22px; box-shadow:var(--shadow); overflow-x:auto; }
  .gantt-row{ display:flex; align-items:center; gap:14px; padding:8px 0; }
  .gantt-label{ width:220px; flex:none; font-size:13px; }
  .gantt-label .rname{ font-weight:600; }
  .gantt-label .rdates{ font-size:11px; color:var(--ink-faint); }
  .gantt-track{ flex:1; position:relative; height:20px; min-width:360px; background:var(--surface-alt); border-radius:6px; }
  .gantt-bar{ position:absolute; top:2px; bottom:2px; border-radius:5px; background:var(--accent); }
  .gantt-bar.past{ background:var(--unknown); }
  .gantt-today{ position:absolute; top:-6px; bottom:-6px; width:2px; background:var(--critical); }
  .gantt-legend{ display:flex; gap:16px; font-size:11.5px; color:var(--ink-faint); margin-top:10px; }
  .gantt-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend-swatch{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  .kb-layout{ display:grid; grid-template-columns:1.3fr 1fr; gap:20px; align-items:start; }
  @media (max-width: 980px){ .kb-layout{ grid-template-columns:1fr; } }
  .chat-panel{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:12px; position:sticky; top:70px; }
  .chat-panel .chat-title{ font-size:14px; font-weight:600; }
  .chat-panel .chat-sub{ font-size:12px; color:var(--ink-faint); }
  .chat-log{ display:flex; flex-direction:column; gap:10px; max-height:340px; overflow-y:auto; }
  .chat-bubble{ font-size:13px; padding:10px 12px; border-radius:10px; background:var(--surface-alt); }
  .chat-bubble.q{ background:var(--accent-soft); color:var(--accent); font-weight:600; }
  .chat-bubble .cite{ display:block; margin-top:6px; font-size:11px; color:var(--ink-faint); font-weight:500; }
  .chat-form{ display:flex; gap:8px; }
  .chat-form input{ flex:1; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:13px; }
  .chat-form button{ padding:9px 14px; border-radius:8px; border:0; background:var(--accent); color:var(--accent-ink); font:inherit; font-size:13px; font-weight:600; cursor:pointer; }

  .note-form textarea{ width:100%; min-height:64px; padding:9px 12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:13px; resize:vertical; }
  .note-form button{ margin-top:8px; padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--surface-alt); color:var(--ink); font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; }
  .note-item{ padding:10px 0; border-top:1px solid var(--line); font-size:13px; }
  .note-item:first-child{ border-top:none; }
  .note-item .meta{ font-size:11px; color:var(--ink-faint); }

  .table-card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px 20px; box-shadow:var(--shadow); }
  .table-card h4{ font-size:14px; margin:0 0 4px; }
  .table-card .why{ font-size:12px; color:var(--ink-faint); margin-bottom:10px; }
  .field-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:4px; }
  .field-list li{ font-size:12.5px; display:flex; justify-content:space-between; gap:10px; padding:4px 0; border-top:1px solid var(--line); }
  .field-list li:first-child{ border-top:none; }
  .field-list .fname{ font-family:"Cascadia Code",Consolas,monospace; }
  .field-list .ftype{ color:var(--ink-faint); white-space:nowrap; }

  footer.foot{
    margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;
    font-size:12px; color:var(--ink-faint);
  }

  @media (max-width: 880px){
    .shell{ flex-direction:column; }
    .sidenav{ position:static; width:100%; height:auto; border-right:none; border-bottom:1px solid var(--line); }
    .card{ grid-column:span 12 !important; }
    main{ padding:20px; }
  }
</style>

<div id="app">
  <header class="topbar">
    <div class="wordmark">
      <span class="name serif">MeshMedic</span>
      <span class="tag">Command Center</span>
    </div>
    <span class="release-pill mono" id="release-pill"></span>
    <span class="stale-pill mono" id="stale-pill" style="display:none;"></span>
    <div class="spacer"></div>
    <div class="mode-toggle" role="group" aria-label="Data mode">
      <button id="btn-sample" onclick="setMode('sample')">Sample</button>
      <button id="btn-real" onclick="setMode('real')">Real</button>
    </div>
  </header>

  <div class="shell">
    <nav class="sidenav" id="sidenav"></nav>
    <main id="view">Loading…</main>
  </div>
</div>

<script>
/* ============================================================
   DATA LOADING
   The Command Center reads from three files at repo root:
     .colaberry/plan.json      — static structure (requirements,
                                  releases, stories, systems,
                                  guardrails, owners)
     .colaberry/progress.json  — runtime state (story status,
                                  system status, guardrail
                                  enforcement, outcomes, decisions)
     .colaberry/manifest.json  — when the data was generated, so
                                  the UI can warn if it's stale
   Fetched at runtime via relative paths. If fetch fails (opened
   as a bare file, or previewed outside a server), each falls
   back to the DEFAULT_* snapshot below, which mirrors the JSON
   files' content at time of writing, so the page still renders.
   No render function below should hardcode data that isn't
   sourced from PLAN / PROGRESS / MANIFEST.
   ============================================================ */
const DEFAULT_PLAN = {
  "project": { "name":"MeshMedic","tagline":"AI-powered clinical documentation and workflow copilot for healthcare professionals.","demoDay":"2026-10-08","buildEnd":"2026-10-01" },
  "requirements": [
    {"id":"REQ-001","cat":"FUNC","priority":"must","text":"Process patient encounter conversations to generate structured clinical notes."},
    {"id":"REQ-002","cat":"FUNC","priority":"must","text":"Suggest appropriate ICD-10 and CPT codes based on encounter data."},
    {"id":"REQ-003","cat":"FUNC","priority":"must","text":"Identify potential gaps in care from encounter data."},
    {"id":"REQ-004","cat":"FUNC","priority":"must","text":"Prepare follow-up documentation such as referral letters for clinician review."},
    {"id":"REQ-005","cat":"FUNC","priority":"must","text":"Allow clinicians to review, edit, approve, or reject AI-generated notes, codes, and recommendations."},
    {"id":"REQ-006","cat":"SAFE","priority":"must","text":"Maintain an auditable history of AI recommendations and clinician actions."},
    {"id":"REQ-007","cat":"FUNC","priority":"must","text":"Provide clear explanations for its recommendations, including source citations."},
    {"id":"REQ-008","cat":"FUNC","priority":"must","text":"Flag low-confidence sections with a visual warning and explanation."},
    {"id":"REQ-009","cat":"FUNC","priority":"must","text":"Retrieve and return authorized patient information through EHR systems using FHIR APIs."},
    {"id":"REQ-010","cat":"CONSTRAINT","priority":"must","text":"Remain EHR-agnostic while integrating with Epic and Oracle Health/Cerner."},
    {"id":"REQ-011","cat":"SAFE","priority":"must","text":"Protect PHI and ensure privacy and security compliance."},
    {"id":"REQ-012","cat":"NFR","priority":"must","text":"Reduce documentation time to under 2 minutes of review per note."},
    {"id":"REQ-013","cat":"FUNC","priority":"must","text":"Distinguish between encounter-supported and AI-generated information."},
    {"id":"REQ-014","cat":"SAFE","priority":"must","text":"Not execute clinical decisions or actions without clinician approval."},
    {"id":"REQ-015","cat":"CONSTRAINT","priority":"must","text":"Use ambient audio recordings and text transcripts as input for note generation."},
    {"id":"REQ-016","cat":"CONSTRAINT","priority":"must","text":"Access patient demographics and problem list/history from EHRs."},
    {"id":"REQ-017","cat":"FUNC","priority":"should","text":"Provide a visual interface for clinicians to interact with AI-generated content."},
    {"id":"REQ-018","cat":"SAFE","priority":"must","text":"Support healthcare compliance standards relevant to clinical documentation."}
  ],
  "releases": [
    {"id":"r0","name":"Initial Skeleton","start":"2026-08-11","end":"2026-08-18","stories":[
      {"id":"STORY-001","title":"Generate and approve AI clinical notes","due":"2026-08-11","owner":"Clinician","reqs":["REQ-001","REQ-005","REQ-014"]},
      {"id":"STORY-002","title":"Maintain auditable history of actions","due":"2026-08-15","owner":"Compliance Officer","reqs":["REQ-006"]},
      {"id":"STORY-003","title":"Flag low-confidence AI recommendations","due":"2026-08-18","owner":"Clinician","reqs":["REQ-008"]}
    ]},
    {"id":"r1","name":"Advanced Coding and Care Gap","start":"2026-08-24","end":"2026-08-29","stories":[
      {"id":"STORY-004","title":"Suggest ICD-10 and CPT codes","due":"2026-08-24","owner":"Clinician","reqs":["REQ-002"]},
      {"id":"STORY-005","title":"Identify and flag care gaps","due":"2026-08-29","owner":"Clinician","reqs":["REQ-003"]}
    ]},
    {"id":"r2","name":"EHR Integration","start":"2026-09-09","end":"2026-09-09","stories":[
      {"id":"STORY-006","title":"Integrate with EHR systems using FHIR APIs","due":"2026-09-09","owner":"System Integrator","reqs":["REQ-009","REQ-010","REQ-016"]}
    ]},
    {"id":"r3","name":"Recommendation Transparency","start":"2026-09-15","end":"2026-09-20","stories":[
      {"id":"STORY-007","title":"Provide source citations for AI recommendations","due":"2026-09-15","owner":"Clinician","reqs":["REQ-007"]},
      {"id":"STORY-008","title":"Indicate AI recommendation confidence","due":"2026-09-20","owner":"Clinician","reqs":["REQ-008"]}
    ]},
    {"id":"r4","name":"Efficiency and Compliance","start":"2026-09-23","end":"2026-10-01","stories":[
      {"id":"STORY-009","title":"Optimize documentation time","due":"2026-09-23","owner":"Clinician","reqs":["REQ-012"]},
      {"id":"STORY-010","title":"Ensure compliance with healthcare standards","due":"2026-09-26","owner":"Compliance Officer","reqs":["REQ-018"]},
      {"id":"STORY-011","title":"Prepare follow-up documentation for clinician review","due":"2026-09-28","owner":"Clinical Documentation System","reqs":["REQ-004"]},
      {"id":"STORY-012","title":"Distinguish between encounter-supported and AI-generated information","due":"2026-10-01","owner":"Clinical Decision Support System","reqs":["REQ-013"]}
    ]}
  ],
  "systems": [
    {"name":"EHR","purpose":"Generic EHR connection point (REQ-009, REQ-016)."},
    {"name":"Epic","purpose":"Named EHR integration target (REQ-010)."},
    {"name":"Oracle Health","purpose":"Named EHR integration target (REQ-010)."},
    {"name":"Cerner","purpose":"Named EHR integration target (REQ-010), now part of Oracle Health."},
    {"name":"EHRs","purpose":"Plural entry as given in the brief — EHR-agnostic integration surface (REQ-010)."}
  ],
  "guardrails": [
    {"req":"REQ-006","text":"Maintain an auditable history of AI recommendations and clinician actions.","story":"STORY-002"},
    {"req":"REQ-011","text":"Protect PHI and ensure privacy and security compliance.","story":null},
    {"req":"REQ-014","text":"Not execute clinical decisions or actions without clinician approval.","story":"STORY-001"},
    {"req":"REQ-018","text":"Support healthcare compliance standards relevant to clinical documentation.","story":"STORY-010"}
  ],

/* ---------------- local, non-generative knowledge search ----------------
   This is a keyword search over PLAN + PROGRESS content, not a language
   model — the Knowledge base tab says so on screen. It never invents an
   answer: no match means it says it doesn't know. */
function searchKnowledge(query){
  const q = query.toLowerCase().trim();
  if(!q) return null;
  const corpus = [];
  PLAN.requirements.forEach(r=>corpus.push({
    text:`${r.id}: ${r.text}`, cite: r.cat==='SAFE' ? 'Guardrails' : (r.id==='REQ-012' ? 'Outcomes' : 'Knowledge base — Requirements'),
    hay:(r.id+' '+r.text+' '+r.cat+' '+r.priority).toLowerCase()
  }));
  PLAN.releases.forEach(rel=>rel.stories.forEach(s=>corpus.push({
    text:`${s.id}: ${s.title} — ${rel.id.toUpperCase()} ${rel.name}, due ${s.due}, owner ${s.owner}.`,
    cite:'Project management', hay:(s.id+' '+s.title+' '+s.owner+' '+rel.name).toLowerCase()
  })));
  PLAN.systems.forEach(sys=>corpus.push({
    text:`${sys.name}: ${sys.purpose}`, cite:'Systems', hay:(sys.name+' '+sys.purpose).toLowerCase()
  }));
  (PROGRESS.decisions||[]).forEach(d=>corpus.push({
    text:`Decision (${d.date}): ${d.text}`, cite: d.tab ? d.tab[0].toUpperCase()+d.tab.slice(1) : 'Knowledge base', hay:(d.text).toLowerCase()
  }));
  const terms = q.split(/\s+/).filter(t=>t.length>2);
  let best=null, bestScore=0;
  corpus.forEach(item=>{
    let score=0;
    terms.forEach(t=>{ if(item.hay.includes(t)) score++; });
    if(item.hay.includes(q)) score += 3;
    if(score>bestScore){ bestScore=score; best=item; }
  });
  return bestScore>0 ? best : null;
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a)) / 86400000); }
function fmtDate(d){ return new Date(d+"T00:00:00").toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function today(){ const t=new Date(); return new Date(t.getFullYear(),t.getMonth(),t.getDate()); }
function todayISO(){ const t=today(); return t.toISOString().slice(0,10); }
function findStory(id){ for(const rel of PLAN.releases){ const s=rel.stories.find(x=>x.id===id); if(s) return {...s, release:rel}; } return null; }
function findReq(id){ return PLAN.requirements.find(r=>r.id===id); }
function reqLink(reqId){
  if(PLAN.guardrails.some(g=>g.req===reqId)) return `<a href="#guardrails/${reqId}" onclick="event.stopPropagation()">${reqId}</a>`;
  if(PLAN.outcomes.some(o=>o.req===reqId)) return `<a href="#outcomes/${reqId}" onclick="event.stopPropagation()">${reqId}</a>`;
  return `<span class="mono">${reqId}</span>`;
}

function currentRelease(){
  const t = todayISO();
  let cur = PLAN.releases.find(r => t >= r.start && t <= r.end);
  if(cur) return cur;
  const next = PLAN.releases.find(r => t < r.start);
  return next || PLAN.releases[PLAN.releases.length-1];
}

function sparkPath(values, w, h){
  const min = Math.min(...values), max = Math.max(...values);
  const span = (max - min) || 1;
  const stepX = w / (values.length - 1);
  return values.map((v,i)=>{
    const x = i*stepX; const y = h - ((v-min)/span)*h;
    return (i===0?"M":"L")+x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
}

function card(inner, {span=4, href=null} = {}){
  const tag = href ? 'a' : 'div';
  const hrefAttr = href ? `href="${href}"` : '';
  return `<${tag} class="card span-${span}" ${hrefAttr}>${inner}</${tag}>`;
}

function renderSparkCard(outcomeDef, outcomeData){
  const w=260,h=56;
  const values = outcomeData.sample;
  const path = sparkPath(values, w, h);
  const last = values[values.length-1];
  const lastX = w, lastY = h - ((last-Math.min(...values))/((Math.max(...values)-Math.min(...values))||1))*h;
  return `
    <div class="sparkline-wrap">
      <svg width="${w}" height="${h+8}" viewBox="0 0 ${w} ${h+8}" role="img" aria-label="Illustrative sample trend toward target, not measured data">
        <path d="${path}" fill="none" stroke="var(--sample)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="${lastX}" cy="${lastY}" r="4" fill="var(--sample)"/>
      </svg>
      <div class="progress-line"><span>Illustrative trend toward target — not real measurements</span><span class="mono">target ${outcomeDef.target}</span></div>
    </div>`;
}

    const sys = PLAN.systems.find(s=>s.name.toLowerCase()===decodeURIComponent(name).toLowerCase());
    if(!sys){ renderNotFound('systems','System'); return; }
    const status = PROGRESS.systemStatus[sys.name] || {status:'unknown', lastChecked:null};
    document.getElementById('view').innerHTML = `
      <div class="breadcrumb"><a href="#systems">Systems</a> / ${sys.name}</div>
      <div class="hero"><h2 class="pagetitle">${sys.name}</h2><p>${sys.purpose}</p></div>
      <div class="detail-panel">
        <div class="status-row" style="border-top:none;">
          <span class="name"><span class="dot ${status.status}"></span>Connection status</span>
          <span class="badge ${status.status==='good'?'good':'unknown'}">${status.status==='good'?'Connected':'Not connected'}</span>
        </div>
        <div class="status-row"><span class="name">Last checked</span><span class="meta">${status.lastChecked ? new Date(status.lastChecked).toLocaleString() : 'never'}</span></div>
        <p style="font-size:13px; color:var(--ink-faint); margin:0;">Connects via FHIR APIs (REQ-009) once STORY-006 ships (r2, due ${fmtDate(findStory('STORY-006').due)}).</p>
      </div>`;
    return;
  }
  document.getElementById('view').innerHTML = `
    <div class="hero"><h2 class="pagetitle">Systems</h2><p>What this connects to. None are connected on day one — that's shown honestly, not defaulted to green.</p></div>
    <div class="table-wrap"><table class="data"><thead><tr><th>System</th><th>Status</th><th>Last checked</th><th></th></tr></thead><tbody>
      ${PLAN.systems.map(s=>{
        const status = PROGRESS.systemStatus[s.name] || {status:'unknown', lastChecked:null};
        return `<tr class="clickable" onclick="location.hash='#systems/${encodeURIComponent(s.name)}'">
          <td>${s.name}</td>
          <td><span class="dot ${status.status}" style="display:inline-block; margin-right:6px;"></span>${status.status==='good'?'Connected':'Not connected'}</td>
          <td class="meta">${status.lastChecked ? new Date(status.lastChecked).toLocaleString() : 'never'}</td>
          <td style="color:var(--accent); font-size:12px;">Details →</td>
        </tr>`;
      }).join('')}
    </tbody></table></div>`;
}

/* ================= PROJECT MANAGEMENT ================= */
function renderPM(storyId){
  if(storyId){
    const s = findStory(storyId);
    if(!s){ renderNotFound('pm','Story'); return; }
    const status = PROGRESS.storyStatus[s.id] || 'not-started';
    document.getElementById('view').innerHTML = `
      <div class="breadcrumb"><a href="#pm">Project management</a> / ${s.id}</div>
      <div class="hero"><h2 class="pagetitle">${s.title}</h2><p><span class="mono">${s.id}</span> · ${s.release.id.toUpperCase()} · ${s.release.name}</p></div>
      <div class="detail-panel">
        <dl class="kv">
          <dt>Status</dt><dd><span class="badge ${status==='done'?'good':'unknown'}">${status==='done'?'Done':'Not started'}</span></dd>
          <dt>Owner</dt><dd>${s.owner}</dd>
          <dt>Due</dt><dd class="mono">${fmtDate(s.due)}</dd>
          <dt>Release window</dt><dd class="mono">${fmtDate(s.release.start)} → ${fmtDate(s.release.end)}</dd>
          <dt>Requirements</dt><dd>${(s.reqs||[]).map(reqLink).join(', ') || '—'}</dd>
        </dl>
      </div>`;
    return;
  }
  const rangeStart = new Date(PLAN.releases[0].start);
  const rangeEnd = new Date(PLAN.releases[PLAN.releases.length-1].end);
  const rangeSpan = (rangeEnd - rangeStart) || 1;
  const pct = d => Math.min(100, Math.max(0, ((new Date(d) - rangeStart) / rangeSpan) * 100));
  const todayPct = pct(todayISO());
  const allStories = [];
  PLAN.releases.forEach(r=>r.stories.forEach(s=>allStories.push({...s, release:r})));

  document.getElementById('view').innerHTML = `
    <div class="hero"><h2 class="pagetitle">Project management</h2><p>Releases r0–r4 and every story beneath them. Demo day is ${fmtDate(PLAN.project.demoDay)}; build ends ${fmtDate(PLAN.project.buildEnd)}, then a week of demo prep.</p></div>
    <div class="gantt">
      ${PLAN.releases.map(r=>{
        const left = pct(r.start), right = pct(r.end);
        const isPast = todayISO() > r.end;
        return `<div class="gantt-row">
          <div class="gantt-label"><div class="rname">${r.id.toUpperCase()} · ${r.name}</div><div class="rdates mono">${fmtDate(r.start)} → ${fmtDate(r.end)}</div></div>
          <div class="gantt-track"><div class="gantt-bar ${isPast?'past':''}" style="left:${left}%; width:${Math.max(right-left,1)}%;"></div></div>
        </div>`;
      }).join('')}
      <div class="gantt-legend"><span><span class="legend-swatch" style="background:var(--accent);"></span>Current / upcoming</span><span><span class="legend-swatch" style="background:var(--unknown);"></span>Window closed</span><span><span class="legend-swatch" style="background:var(--critical);"></span>Today</span></div>
    </div>
    <div class="section">
      <div class="section-head"><h3>All stories</h3><span class="count">${allStories.length} total</span></div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Story</th><th>Title</th><th>Release</th><th>Owner</th><th>Due</th><th>Status</th></tr></thead><tbody>
        ${allStories.map(s=>{
          const status = PROGRESS.storyStatus[s.id] || 'not-started';
          return `<tr class="clickable" onclick="location.hash='#pm/${s.id}'">
            <td class="mono">${s.id}</td><td>${s.title}</td><td>${s.release.id.toUpperCase()}</td><td>${s.owner}</td>
            <td class="mono">${fmtDate(s.due)}</td><td><span class="badge ${status==='done'?'good':'unknown'}">${status==='done'?'Done':'Not started'}</span></td>
          </tr>`;
        }).join('')}
      </tbody></table></div>
    </div>`;
}

/* ================= AI AGENTS ================= */

    if(!owner){ renderNotFound('agents','Owner'); return; }
    const stories = owner.stories.map(findStory).filter(Boolean);
    const skills = PROGRESS.agentsScoped[owner.name] || [];
    document.getElementById('view').innerHTML = `
      <div class="breadcrumb"><a href="#agents">AI agents</a> / ${owner.name}</div>
      <div class="hero"><h2 class="pagetitle">${owner.name}</h2><p>${owner.type==='role' ? 'Human role' : 'System component'} — an owner of stories, not a scoped AI agent.</p></div>
      <div class="section">
        <div class="section-head"><h3>Skills</h3></div>
        ${skills.length ? `<div class="req-chip-row">${skills.map(s=>`<span class="req-chip">${s}</span>`).join('')}</div>` : `<div class="empty-state">No skills registered yet.</div>`}
      </div>
      <div class="section">
        <div class="section-head"><h3>Owned stories</h3></div>
        <div class="table-wrap"><table class="data"><thead><tr><th>Story</th><th>Title</th><th>Release</th><th>Due</th></tr></thead><tbody>
          ${stories.map(s=>`<tr class="clickable" onclick="location.hash='#pm/${s.id}'"><td class="mono">${s.id}</td><td>${s.title}</td><td>${s.release.id.toUpperCase()}</td><td class="mono">${fmtDate(s.due)}</td></tr>`).join('')}
        </tbody></table></div>
      </div>`;

  }
  document.getElementById('view').innerHTML = `
    <div class="hero"><h2 class="pagetitle">AI agents</h2><p>The plan doesn't carry a scoped agent roster yet, so this tab is built from who owns each story — owners, not agents.</p></div>
    <div class="grid">
      ${PLAN.owners.map(o=>{
        const skills = PROGRESS.agentsScoped[o.name] || [];
        return card(`<div class="card-label">${o.type==='role'?'Human role':'System component'}</div><h3>${o.name}</h3><div class="sub">${o.stories.length} stories owned</div><div style="font-size:12px; color:${skills.length?'var(--ink-soft)':'var(--ink-faint)'};">${skills.length ? skills.join(', ') : 'No skills registered yet'}</div><div class="card-foot">Details →</div>`, {span:4, href:`#agents/${encodeURIComponent(o.name)}`});
      }).join('')}

}

/* ================= KNOWLEDGE BASE ================= */
let CHAT_LOG = [];
function askKB(ev){
  ev.preventDefault();
  const input = document.getElementById('kb-chat-input');
  const q = input.value;
  if(!q.trim()) return;
  const hit = searchKnowledge(q);
  CHAT_LOG.push({role:'q', text:q});
  CHAT_LOG.push(hit ? {role:'a', text:hit.text, cite:hit.cite} : {role:'a', text:"I don't have anything about that yet in the knowledge base.", cite:null});
  input.value = '';
  renderKB();
}
function addNote(ev){
  ev.preventDefault();
  const ta = document.getElementById('kb-note-input');
  const text = ta.value.trim();
  if(!text) return;
  const notes = JSON.parse(localStorage.getItem('mc-notes')||'[]');
  notes.unshift({date: new Date().toISOString().slice(0,10), text});
  localStorage.setItem('mc-notes', JSON.stringify(notes));
  ta.value = '';
  renderKB();
}
function renderKB(){
  const localNotes = JSON.parse(localStorage.getItem('mc-notes')||'[]');
  const chatHtml = CHAT_LOG.map(m=>`<div class="chat-bubble ${m.role}">${esc(m.text)}${m.cite?`<span class="cite">from: ${esc(m.cite)}</span>`:''}</div>`).join('')
    || `<div class="chat-bubble">Ask about any requirement, story, system, or decision — e.g. "REQ-006" or "audit history".</div>`;

  document.getElementById('view').innerHTML = `
    <div class="hero"><h2 class="pagetitle">Knowledge base</h2><p>Everything the project knows about itself. Grows for the whole programme — this page never gets regenerated from scratch, only added to.</p></div>
    <div class="kb-layout">
      <div>
        <div class="section" style="margin-top:0;">
          <div class="section-head"><h3>Requirements</h3><span class="count">${PLAN.requirements.length}</span></div>
          <div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Category</th><th>Priority</th><th>Text</th></tr></thead><tbody>
            ${PLAN.requirements.map(r=>`<tr><td class="mono">${r.id}</td><td>${r.cat}</td><td>${r.priority}</td><td>${r.text}</td></tr>`).join('')}
          </tbody></table></div>
        </div>
        <div class="section">
          <div class="section-head"><h3>Stories</h3><span class="count">${PLAN.releases.reduce((n,r)=>n+r.stories.length,0)}</span></div>
          <div class="table-wrap"><table class="data"><thead><tr><th>ID</th><th>Title</th><th>Release</th><th>Due</th></tr></thead><tbody>
            ${PLAN.releases.flatMap(r=>r.stories.map(s=>`<tr class="clickable" onclick="location.hash='#pm/${s.id}'"><td class="mono">${s.id}</td><td>${s.title}</td><td>${r.id.toUpperCase()}</td><td class="mono">${fmtDate(s.due)}</td></tr>`)).join('')}
          </tbody></table></div>
        </div>
        <div class="section">
          <div class="section-head"><h3>Decisions</h3><span class="count">${(PROGRESS.decisions||[]).length}</span></div>
          ${(PROGRESS.decisions||[]).length ? (PROGRESS.decisions||[]).map(d=>`<div class="note-item"><div>${d.text}</div><div class="meta">${d.date} · ${d.tab}</div></div>`).join('') : `<div class="empty-state">No decisions logged yet.</div>`}
        </div>
        <div class="section">
          <div class="section-head"><h3>Notes</h3><span class="count">${localNotes.length}</span></div>
          <div class="table-card">
            <form class="note-form" onsubmit="addNote(event)">
              <textarea id="kb-note-input" placeholder="Add a note (saved to this browser only for now)"></textarea>
              <button type="submit">Add note</button>
            </form>
            ${localNotes.length ? localNotes.map(n=>`<div class="note-item"><div>${esc(n.text)}</div><div class="meta">${n.date}</div></div>`).join('') : `<div class="empty-state" style="margin-top:10px;">Nothing added yet.</div>`}
          </div>
        </div>
      </div>
      <div class="chat-panel">
        <div class="chat-title">Ask the knowledge base</div>
        <div class="chat-sub">Keyword search over this project's own data — not a general AI chat. No match means it says so.</div>
        <div class="chat-log" id="kb-chat-log">${chatHtml}</div>
        <form class="chat-form" onsubmit="askKB(event)">
          <input id="kb-chat-input" type="text" placeholder="e.g. what does REQ-014 require?" />
          <button type="submit">Ask</button>
        </form>
      </div>
    </div>`;
  const log = document.getElementById('kb-chat-log');
  if(log) log.scrollTop = log.scrollHeight;
}

/* ================= DATA MODEL ================= */
const DATA_MODEL_TABLES = [
  {name:"Requirement", why:"REQ-001…REQ-018 as given — the source of truth every other table traces back to.", fields:[["id","string, PK"],["category","FUNC | SAFE | CONSTRAINT | NFR"],["priority","must | should"],["text","string"]]},
  {name:"Story", why:"One build-order item per requirement slice; carries the Gantt.", fields:[["id","string, PK"],["title","string"],["dueDate","date"],["releaseId","→ Release.id"],["ownerId","→ Owner.id"],["status","not-started | in-progress | done"]]},
  {name:"Release", why:"r0–r4 groupings that give Story its due window.", fields:[["id","string, PK"],["name","string"],["startDate","date"],["endDate","date"]]},
  {name:"Owner", why:"Clinician / Compliance Officer / System Integrator / the two system components — who Story belongs to.", fields:[["id","string, PK"],["name","string"],["type","role | system"]]},
  {name:"Encounter", why:"REQ-001, REQ-015 — the ambient audio/transcript input a note is generated from.", fields:[["id","string, PK"],["patientRef","string"],["occurredAt","datetime"],["transcriptRef","string"]]},
  {name:"ClinicalNote", why:"REQ-001, REQ-005 — the note itself and its approval state, never auto-executed (REQ-014).", fields:[["id","string, PK"],["encounterId","→ Encounter.id"],["status","draft | approved | rejected"],["generatedAt","datetime"],["approvedByOwnerId","→ Owner.id, nullable"],["approvedAt","datetime, nullable"]]},
  {name:"NoteSection", why:"REQ-007, REQ-008, REQ-013 — per-section text with its confidence and whether it's encounter-supported or AI-generated.", fields:[["id","string, PK"],["noteId","→ ClinicalNote.id"],["text","string"],["sourceType","encounter-supported | ai-generated"],["confidence","0.0–1.0"],["citationRef","string, nullable"]]},
  {name:"CodeSuggestion", why:"REQ-002 — ICD-10/CPT suggestions, reviewed like everything else (REQ-005).", fields:[["id","string, PK"],["encounterId","→ Encounter.id"],["codeSystem","ICD10 | CPT"],["code","string"],["confidence","0.0–1.0"],["status","suggested | approved | rejected"]]},
  {name:"CareGapFlag", why:"REQ-003 — a gap in care surfaced from encounter data.", fields:[["id","string, PK"],["patientRef","string"],["gapType","string"],["description","string"],["status","open | resolved"]]},
  {name:"FollowUpDocument", why:"REQ-004 — referral letters and similar, prepared for review, not sent automatically.", fields:[["id","string, PK"],["encounterId","→ Encounter.id"],["docType","string"],["draftText","string"],["status","draft | approved"]]},
  {name:"AuditEvent", why:"REQ-006 — every AI recommendation and clinician action, auditable. Also the source for the REQ-012 timing calculation.", fields:[["id","string, PK"],["actorType","ai | clinician"],["action","string"],["targetType","string"],["targetId","string"],["occurredAt","datetime"]]},
  {name:"EhrConnection", why:"REQ-009, REQ-010, REQ-016 — the Systems tab's live rows. Named for the connection, not the vendor.", fields:[["id","string, PK"],["systemName","EHR | Epic | Oracle Health | Cerner | EHRs"],["status","unknown | good | critical"],["lastCheckedAt","datetime, nullable"]]},
  {name:"ComplianceMapping", why:"REQ-018 — which healthcare compliance standard each guardrail maps to.", fields:[["id","string, PK"],["requirementId","→ Requirement.id"],["standardName","string"],["status","mapped | unmapped"]]}
];
function renderDataModel(tableName){
  if(tableName){
    const t = DATA_MODEL_TABLES.find(x=>x.name.toLowerCase()===decodeURIComponent(tableName).toLowerCase());
    if(!t){ renderNotFound('datamodel','Table'); return; }
    document.getElementById('view').innerHTML = `
      <div class="breadcrumb"><a href="#datamodel">Data model</a> / ${t.name}</div>
      <div class="hero"><h2 class="pagetitle">${t.name}</h2><p>${t.why}</p></div>
      <div class="detail-panel">
        <ul class="field-list">${t.fields.map(f=>`<li><span class="fname">${f[0]}</span><span class="ftype">${f[1]}</span></li>`).join('')}</ul>
      </div>`;
    return;
  }
  document.getElementById('view').innerHTML = `
    <div class="hero"><h2 class="pagetitle">Data model</h2><p>The tables behind everything else on this site, derived from the 18 requirements. <strong>Proposal only — nothing has been created yet.</strong> This is a starting point to review before anything gets built.</p></div>
    <div class="grid">
      ${DATA_MODEL_TABLES.map(t=>card(`<h4>${t.name}</h4><div class="why">${t.why}</div><ul class="field-list">${t.fields.slice(0,4).map(f=>`<li><span class="fname">${f[0]}</span><span class="ftype">${f[1]}</span></li>`).join('')}${t.fields.length>4?`<li style="color:var(--ink-faint); border-top:none;">+ ${t.fields.length-4} more</li>`:''}</ul>`, {span:4, href:`#datamodel/${encodeURIComponent(t.name)}`})).join('')}
    </div>`;
}

/* ---------------- not found ---------------- */
function renderNotFound(tab, kind){
  document.getElementById('view').innerHTML = `<div class="breadcrumb"><a href="#${tab}">${TABS.find(t=>t.id===tab).label}</a></div><div class="empty-state">${kind} not found in the current data.</div>`;
}

/* ---------------- router ---------------- */
function render(){
  const raw = location.hash.replace('#','') || 'overview';
  const [top, sub] = raw.split(/\/(.+)/);
  renderNav(top);
  topbarMeta();
  const subDecoded = sub;
  switch(top){
    case 'overview': renderOverview(); break;
    case 'outcomes': renderOutcomes(subDecoded); break;
    case 'users': renderUsers(subDecoded); break;
    case 'guardrails': renderGuardrails(subDecoded); break;
    case 'systems': renderSystems(subDecoded); break;
    case 'pm': renderPM(subDecoded); break;
    case 'agents': renderAgents(subDecoded); break;
    case 'kb': CHAT_LOG = CHAT_LOG || []; renderKB(); break;
    case 'datamodel': renderDataModel(subDecoded); break;
    default: renderOverview();
  }
}
window.addEventListener('hashchange', render);
loadData();
</script>
